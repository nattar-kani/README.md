name: Update dynamic reading log

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-reading-log:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Goodreads reading log
        run: python scripts/update_reading_log.py

      - name: Commit updated reading log
        run: |
          if git diff --quiet README.md; then
            echo "No reading-log changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update Goodreads reading log"
          git push
